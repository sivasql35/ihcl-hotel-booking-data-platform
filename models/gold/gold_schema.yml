
version: 2

models:
  # ============================================================
  # PMS GOLD MODELS
  # ============================================================

  - name: dim_date
    description: "Calendar dimension containing continuous dates for hotel booking analytics."
    columns:
      - name: DATE_KEY
        description: "Integer date key in YYYYMMDD format."
        tests:
          - not_null
          - unique

      - name: FULL_DATE
        description: "Actual calendar date."
        tests:
          - not_null
          - unique

      - name: YEAR
        tests:
          - not_null

      - name: MONTH
        tests:
          - not_null

      - name: IS_WEEKEND
        tests:
          - not_null

  - name: fact_bookings
    description: "Gold fact table containing hotel booking records and dimension keys."
    columns:
      - name: BOOKING_KEY
        description: "Unique technical identifier for each source booking record."
        tests:
          - not_null
          - unique

      - name: HOTEL_KEY
        description: "Foreign key referencing the hotel dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hotel')
                field: HOTEL_KEY

      - name: DATE_KEY
        description: "Foreign key referencing the arrival date dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: DATE_KEY

      - name: IS_CANCELED
        description: "Cancellation indicator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_hotel_performance
    description: "Hotel-level business performance metrics aggregated from booking records."
    columns:
      - name: HOTEL_KEY
        tests:
          - not_null
          - unique

      - name: HOTEL
        tests:
          - not_null

      - name: TOTAL_BOOKINGS
        tests:
          - not_null

      - name: CANCELED_BOOKINGS
        tests:
          - not_null

      - name: NOT_CANCELED_BOOKINGS
        tests:
          - not_null

      - name: CANCELLATION_RATE_PCT
        tests:
          - not_null

      - name: AVG_ADR
        tests:
          - not_null

      - name: TOTAL_ROOM_NIGHTS
        tests:
          - not_null

  # ============================================================
  # CRM GOLD MODELS
  # ============================================================

  - name: gold_crm_customer_360
    description: "Unified customer profile combining customer information, interaction history and marketing campaign activity."
    columns:
      - name: CUSTOMER_ID
        description: "Unique customer identifier; one record per customer."
        tests:
          - not_null
          - unique

  - name: gold_crm_engagement_summary
    description: "Customer-level engagement metrics covering interactions, statuses, priorities, channels and satisfaction."
    columns:
      - name: CUSTOMER_ID
        description: "Unique customer identifier; one record per customer."
        tests:
          - not_null
          - unique

  - name: gold_crm_campaign_performance
    description: "Campaign-level marketing performance metrics covering delivery, engagement, conversions, revenue and campaign costs."
    columns:
      - name: CAMPAIGN_ID
        description: "Unique marketing campaign identifier; one record per campaign."
        tests:
          - not_null
          - unique

      - name: TOTAL_ACTIVITIES
        tests:
          - not_null

      - name: DELIVERED_ACTIVITIES
        tests:
          - not_null

      - name: BOUNCED_ACTIVITIES
        tests:
          - not_null

      - name: OPENED_ACTIVITIES
        tests:
          - not_null

      - name: CLICKED_ACTIVITIES
        tests:
          - not_null

      - name: CONVERTED_ACTIVITIES
        tests:
          - not_null

  - name: gold_crm_customer_segments
    description: "Customer-segment-level analytics covering customer counts, loyalty, engagement, campaign conversions and return on marketing spend."
    columns:
      - name: CUSTOMER_SEGMENT
        description: "Customer segment classification; one record per segment."
        tests:
          - not_null
          - unique

      - name: TOTAL_CUSTOMERS
        tests:
          - not_null